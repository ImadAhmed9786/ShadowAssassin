name: Deploy Shadow Assassin to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.64

      - name: Verify Emscripten
        run: emcc --version

      - name: Configure Web Build
        run: |
          emcmake cmake -B build-web \
            -DPLATFORM=Web \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTS=OFF

      - name: Compile WebAssembly Game
        run: cmake --build build-web --verbose

      - name: Prepare Web Assets for GitHub Pages
        run: |
          mkdir -p public
          if [ -f build-web/ShadowAssassin.html ]; then
            cp build-web/ShadowAssassin.html public/index.html
          else
            find build-web -name "*.html" -exec cp {} public/index.html \;
          fi
          find build-web -name "*.js" -exec cp {} public/ \; || true
          find build-web -name "*.wasm" -exec cp {} public/ \; || true
          find build-web -name "*.data" -exec cp {} public/ \; || true

          # Inject clean Laptop-Only restriction for mobile devices
          python3 -c '
          with open("public/index.html", "r") as f:
              html = f.read()
          blocker = """
          <div id="mobile-notice" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#0a0e17; color:#fff; z-index:999999; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:25px; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;">
            <div style="font-size:52px; margin-bottom:15px;">💻</div>
            <h2 style="color:#00e5ff; letter-spacing:2px; margin:0 0 10px 0; font-size:24px;">LAPTOP / PC ONLY</h2>
            <p style="color:#94a3b8; max-width:340px; line-height:1.6; font-size:15px; margin:0 0 15px 0;">
              <strong>Shadow Assassin</strong> is a tactical stealth keyboard engine requiring <b>WASD</b> and <b>Space</b> keys.
            </p>
            <div style="background:#131d2e; border:1px solid #1e293b; border-radius:8px; padding:12px 18px; color:#38bdf8; font-size:13px; font-weight:600;">
              Please open this link on your Laptop or Computer!
            </div>
          </div>
          <script>
            if (/Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth < 800) {
              document.getElementById("mobile-notice").style.display = "flex";
            }
          </script>
          """
          if "</body>" in html:
              html = html.replace("</body>", blocker + "</body>")
          with open("public/index.html", "w") as f:
              f.write(html)
          '
          ls -la public/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
